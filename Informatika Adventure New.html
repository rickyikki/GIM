function mkP(k,cs){const g=new THREE.Group(),C=[0xff8fb8,0x7fd1ff,0x9be58f,0xffd966][k];

const ACH={first:'🎯 Jawaban Pertama',coin:'🪙 Kolektor Koin (20 koin)',perf:'✨ Dunia Sempurna',pro:'🏆 Juara (1500+ poin)',fin:'🎓 Lulusan Informatika'};
function chk(e){const g=[];if(S.ok>=1)g.push('first');if(S.coins>=20)g.push('coin');if(e=='perf')g.push('perf');if(S.score>=1500)g.push('pro');if(e=='fin')g.push('fin');
g.forEach(k=>{if(!PF.a.includes(k)){PF.a.push(k);sv('ia_pf',PF);toast('Pencapaian: '+ACH[k]);SF.ok()}})}

/* ---------- menu & screens ---------- */
function menu(){S.mode='menu';D(`<div class="em">🎮</div><h2 style="margin:4px">INFORMATIKA ADVENTURE</h2><div>Petualangan Belajar Bersama Guru Cilik</div><input id="nm" placeholder="Nama kamu" maxlength="14" value="${PF.n}"><div><b>Karakter</b></div><div id="chs"></div><div><b>Kostum</b></div><div id="cs"></div><button class="b" onclick="go()">▶ Mulai Petualangan</button><br><button class="b s" onclick="lb()">🏆 Peringkat</button><button class="b s" onclick="prof()">👤 Profil</button>`);rnd()}
function rnd(){$('chs').innerHTML=CH.map((c,i)=>`<button class="b ${PF.k==i?'':'s'}" onclick="pk(${i})">${c}</button>`).join('');
$('cs').innerHTML=COST.map((c,i)=>PF.u.includes(i)?`<button class="b ${PF.c==i?'':'s'}" onclick="pc(${i})">${c}</button>`:`<button class="b s" disabled>🔒 ?</button>`).join('')}
function pk(i){PF.k=i;setP();rnd()}
function pc(i){PF.c=i;setP();rnd()}
function go(){au();const n=($('nm').value||'').replace(/[^\w \-.]/g,'').trim();PF.n=n||'Pemain';sv('ia_pf',PF);
Object.assign(S,{score:0,coins:0,stars:0,ok:0,no:0,t:0,wn:0});w=0;build();intro()}
function lb(){D(`<h3>🏆 Papan Peringkat</h3>`+(LB.length?LB.map((r,i)=>`<div>${i+1}. <b>${r.n}</b> — ${r.s} poin (${fmt(r.t)})</div>`).join(''):'<div>Belum ada skor. Jadilah yang pertama!</div>')+`<button class="b" onclick="menu()">◀ Kembali</button>`)}
function prof(){D(`<h3>👤 Profil: ${PF.n||'Pemain'}</h3><div>Skor terbaik: <b>${PF.b}</b></div><div>Kostum: ${PF.u.map(i=>COST[i]).join(', ')}</div><div>Pencapaian:<br>${PF.a.length?PF.a.map(k=>ACH[k]).join('<br>'):'Belum ada'}</div><button class="b" onclick="menu()">◀ Kembali</button>`)}
function intro(i=0){S.mode='dlg';const p=TX[w],last=i>=p.length;
const m=last?`Tantangan! Temukan dan buka 5 Mystery Box ❓ di dunia ini. Jawab benar untuk dapat 100 poin, koin, dan bintang!<br><small>🕹️ Panah/WASD = jalan, Spasi = lompat. Ambil juga koin emas!</small>`:(i==0?`Halo ${PF.n}! Selamat datang di dunia ini. `:'')+p[i];
D(`<div class="em">${IC[w]}</div><b>Dunia ${w+1}: ${WN[w]}</b>`+tc(m)+`<button class="b" onclick="${last?"H();S.mode='play'":'intro('+(i+1)+')'}">${last?'Mulai! 🚀':'Lanjut ▶'}</button>`);say(m)}
function rep(){if(S.mode=='play')intro()}
function qz(i){S.mode='dlg';ci=i;cq=Q[w][i];showQ()}
function showQ(){D(`<b>🎁 Mystery Box ${ci+1}/5</b>`+tc(cq.q)+cq.o.map((o,k)=>`<button class="o" onclick="an(${k})">${'ABCD'[k]}. ${o}</button>`).join(''));say(cq.q)}
function an(k){if(k==cq.a){SF.ok();S.score+=100;S.ok++;S.stars++;const b=1+(Math.random()*3|0);S.coins+=b;let ex='';
if(Math.random()<.3){const n=[1,2,3].find(x=>!PF.u.includes(x));if(n!=null){PF.u.push(n);sv('ia_pf',PF);ex=`<br>🎁 Hadiah Mystery Box: kostum baru <b>${COST[n]}</b>! (pilih di menu)`}}
boxes[ci].d=1;boxes[ci].g.visible=false;
D(tc(`Benar! 🎉 +100 poin, +${b} koin, +1 ⭐<br>${cq.e}${ex}`)+`<button class="b" onclick="nx()">Lanjut ▶</button>`);say('Benar! '+cq.e);chk()}
else{SF.no();S.no++;S.wn++;D(tc(`Ups, belum tepat 😅<br>${cq.e}<br>Yuk coba lagi!`)+`<button class="b" onclick="showQ()">Coba lagi 🔁</button>`);say('Ups, belum tepat. '+cq.e)}}
function nx(){if(boxes.every(b=>b.d))wend();else{H();S.mode='play'}}
function wend(){S.mode='dlg';const pf=S.wn==0;if(pf){S.score+=200;chk('perf')}
if(w<6)D(`<div class="em">🏅</div>`+tc(`Dunia ${w+1} selesai!${pf?' Sempurna tanpa salah, bonus +200 poin! ✨':''} Siap ke dunia berikutnya: ${WN[w+1]}?`)+`<button class="b" onclick="nw()">Dunia berikutnya ▶</button>`);else fin()}
function nw(){w++;build();intro()}
function fin(){S.mode='end';chk('fin');LB.push({n:PF.n,s:S.score,t:Math.round(S.t)});LB.sort((a,b)=>b.s-a.s);LB=LB.slice(0,10);sv('ia_lb',LB);PF.b=Math.max(PF.b,S.score);sv('ia_pf',PF);SF.ok();
D(`<div class="em">🎓</div>`+tc(`Selamat ${PF.n}! Kamu menyelesaikan semua dunia informatika! Kamu hebat sekali! 🎉`)+`<div>⭐ Skor: <b>${S.score}</b> · ✅ Benar: <b>${S.ok}</b> · ❌ Salah: <b>${S.no}</b> · 🪙 ${S.coins} · ⏱ ${fmt(S.t)}</div><div class="cert">🏅 <b>SERTIFIKAT KELULUSAN</b><br>Diberikan kepada<br><big><b>${PF.n}</b></big><br>yang telah menyelesaikan 7 dunia INFORMATIKA ADVENTURE<br>Skor ${S.score} · ${new Date().toLocaleDateString('id-ID')}</div><button class="b" onclick="menu()">🔁 Main Lagi</button><button class="b s" onclick="lb()">🏆 Peringkat</button>`);say(`Selamat ${PF.n}! Kamu menyelesaikan semua dunia informatika!`)}
function pz(){if(S.mode=='play'||S.mode=='pause'){S.mode='pause';D(`<h3>⏸ Jeda</h3><button class="b" onclick="tg('mus')">🎵 Musik: ${S.mus?'ON':'OFF'}</button><button class="b" onclick="tg('sfx')">🔊 Efek: ${S.sfx?'ON':'OFF'}</button><button class="b" onclick="tg('vo')">🗣️ Suara guru: ${S.vo?'ON':'OFF'}</button><br><button class="b s" onclick="H();S.mode='play'">▶ Lanjut</button><button class="b s" onclick="menu()">🏠 Menu</button>`)}}
function tg(k){S[k]=!S[k];pz()}
function mute(){const m=S.sfx&&S.mus;S.sfx=S.mus=S.vo=m?0:1;toast(m?'Suara dimatikan':'Suara dinyalakan');if(m)try{speechSynthesis.cancel()}catch(e){}}
function fs(){const d=document.documentElement;try{Promise.resolve(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>{})}catch(e){}}

/* ---------- input ---------- */
const K={};
addEventListener('keydown',e=>{au();const k=e.key.length>1?e.key:e.key.toLowerCase();K[k]=1;if(S.mode=='play'&&(k.startsWith('Arrow')||k==' '))e.preventDefault()});
addEventListener('keyup',e=>{K[e.key.length>1?e.key:e.key.toLowerCase()]=0});
document.querySelectorAll('.k').forEach(b=>{const k=b.dataset.k=='Space'?' ':b.dataset.k;
b.addEventListener('pointerdown',e=>{e.preventDefault();au();K[k]=1});
['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>K[k]=0))});

/* ---------- loop ---------- */
let last=0,hc='';
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;const T=t/1000;
flo.forEach((s,i)=>s.position.y=s.userData.y+Math.sin(T*2+i)*.4);
cl.forEach(c=>{c.position.x+=dt*.6;if(c.position.x>32)c.position.x=-32});
sts.forEach(s=>s.rotation.y+=dt*2);
boxes.forEach((b,i)=>{b.g.rotation.y+=dt;b.g.position.y=.9+Math.sin(T*2+i)*.15});
coins.forEach(c=>c.rotation.z+=dt*3);
if(TE){TE.position.y=Math.abs(Math.sin(T*(S.talk?6:2)))*(S.talk?.4:.08);TE.lookAt(P.position.x,TE.position.y,P.position.z)}
if(S.mode=='play'){S.t+=dt;
const f=(K.ArrowUp||K.w?1:0)-(K.ArrowDown||K.s?1:0),tr=(K.ArrowLeft||K.a?1:0)-(K.ArrowRight||K.d?1:0);
P.rotation.y+=tr*2.6*dt;const y=P.rotation.y;
P.position.x+=Math.sin(y)*f*6*dt;P.position.z+=Math.cos(y)*f*6*dt;
const r=Math.hypot(P.position.x,P.position.z);if(r>16){P.position.x*=16/r;P.position.z*=16/r}
if(K[' ']&&P.position.y==0){vy=8;SF.jump()}
vy-=22*dt;P.position.y+=vy*dt;if(P.position.y<=0){P.position.y=0;vy=0}
P.rotation.z=f?Math.sin(T*12)*.08:0;
boxes.forEach((b,i)=>{if(!b.d&&Math.hypot(P.position.x-b.g.position.x,P.position.z-b.g.position.z)<1.4&&P.position.y<2){K.ArrowUp=K.w=0;qz(i)}});
for(let i=coins.length-1;i>=0;i--){const c=coins[i];if(Math.hypot(P.position.x-c.position.x,P.position.z-c.position.z)<1.1&&P.position.y<1.5){env.remove(c);coins.splice(i,1);S.coins++;SF.coin();chk()}}
const tx=P.position.x-Math.sin(y)*6.5,tz=P.position.z-Math.cos(y)*6.5,k=Math.min(1,5*dt);
cam.position.x+=(tx-cam.position.x)*k;cam.position.z+=(tz-cam.position.z)*k;cam.position.y+=(4.5+P.position.y*.5-cam.position.y)*k;
cam.lookAt(P.position.x,P.position.y+1.2,P.position.z)}
else if(S.mode=='menu'){cam.position.set(Math.sin(T*.3)*14,6,Math.cos(T*.3)*14+4);cam.lookAt(0,1.5,5)}
else{const y=P.rotation.y;cam.lookAt(P.position.x,P.position.y+1.2,P.position.z)}
const h=`Lv ${w+1}/7 ${WN[w]} · 🏁 ${S.score} · ⭐ ${S.stars} · 🪙 ${S.coins} · ⏱ ${fmt(S.t)} · 📦 ${boxes.filter(b=>!b.d).length}`;
if(h!=hc){hc=h;$('hs').textContent=h}
R.render(sc,cam)}
setP();build();menu();requestAnimationFrame(loop);
</script></body></html>
